<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Text/Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#accentGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animated Background Elements */
    @keyframes pulsePulse {
      0% { r: 4px; opacity: 0.2; }
      50% { r: 12px; opacity: 0.8; }
      100% { r: 4px; opacity: 0.2; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    .pulsing-node {
      animation: pulsePulse 3s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashFlow 2s linear infinite;
    }
    .floating-card {
      animation: floatParticle 4s infinite ease-in-out;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Decorative Dynamic Background Graphic Elements (Kept in Background / Lower opacity) -->
  <g opacity="0.25">
    <!-- Flow connecting lines -->
    <path class="flow-line" d="M 100 80 Q 300 20 500 80 T 900 80" stroke="#818cf8" stroke-width="2" fill="none"/>
    <path class="flow-line" d="M 200 240 Q 600 300 1000 240" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Nodes -->
    <circle cx="100" cy="80" r="6" fill="#38bdf8" class="pulsing-node"/>
    <circle cx="500" cy="80" r="8" fill="#818cf8" class="pulsing-node" style="animation-delay: 1s;"/>
    <circle cx="900" cy="80" r="6" fill="#c084fc" class="pulsing-node" style="animation-delay: 2s;"/>
  </g>

  <!-- Dynamic Decorative Floating Micro Cards (Background level) -->
  <g class="floating-card" opacity="0.3" transform="translate(950, 40)">
    <rect width="180" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">GitOps Loop</text>
    <text x="15" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Reconciled: 100%</text>
  </g>

  <g class="floating-card" opacity="0.3" transform="translate(70, 200)" style="animation-delay: 2s;">
    <rect width="160" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="28" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">Kubernetes</text>
    <text x="15" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">Clusters: Multi-Cloud</text>
  </g>

  <!-- Primary Foreground Content (Title and Subtitle - Fully Visible and Unobstructed) -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-110" y="-85" width="220" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="-65" class="badge-text" text-anchor="middle">🚀 AWESOME GITOPS PLATFORM</text>

    <!-- Main Title with Glow -->
    <text x="0" y="5" class="title" filter="url(#glow)">Awesome GitOps Platform</text>
    <text x="0" y="5" class="title">Awesome GitOps Platform</text>

    <!-- Subtitle -->
    <text x="0" y="50" class="subtitle">Curated SaaS Products, Open-Source Engines &amp; Continuous Delivery Tools</text>
  </g>
</svg>
